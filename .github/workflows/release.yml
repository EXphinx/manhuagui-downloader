name: Release desktop apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install sidecar builder
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Run Python tests
        run: python -m unittest discover -v

      - name: Run frontend tests
        run: pnpm test

      - name: Build Python sidecar
        run: python scripts/build_sidecar.py --target-triple ${{ matrix.target }}

      - name: Build and publish desktop package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: ManhuaGui Downloader v__VERSION__
          releaseBody: |
            Desktop packages for Windows x64, macOS Intel, and macOS Apple Silicon.

            These packages are not signed with a trusted publisher certificate or notarized.
          releaseDraft: false
          prerelease: false
          retryAttempts: 2
          args: --target ${{ matrix.target }}
          releaseAssetNamePattern: manhuagui-downloader_[version]_[platform]_[arch][setup].[ext]
